<!DOCTYPE html>
<html>
    <head>
        <title>Timeline Planner</title>
        <link rel="stylesheet" href="styles/css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="popup" id="popup">
            <h2 id="popup-prompt"></h2>
            <input type="text" id="popup-input" />
        </div>

        <div class="wrapper">
            <div class="flex-element" id="timeline-wrapper">
                <ul id="timeline" class="timeline">
                    <h2 id="noelem">You have no tasks</h2>
                </ul>
            </div>
            <div class="flex-element">
                <div class="form">
                    <div>
                        <h1>General</h1>
                        <form id="name">
                            <label>Timetable name</label>
                            <input type="text" id="GTimetableName" required />
                        </form>
                        <form id="day">
                            <label>Day</label>
                            <select id="GDay" required></select>
                        </form>
                    </div>
                </div>
                <div class="form">
                    <h1>Time slots</h1>
                    <div class="form-content">
                        <form onsubmit="return addTimeSlot(event)">
                            <label>Start time</label>
                            <input required type="time" id="TSStart" />
                            <br />
                            <label>End time</label>
                            <input required type="time" id="TSEnd" />
                            <span
                                id="TSTimeError"
                                style="display: none"
                                class="form-error"
                            ></span>
                            <br class="RemoveIfError" />
                            <br />
                            <label>Name </label>
                            <input required type="text" id="TSName" />
                            <br /><br />
                            <button type="submit" data-shortcut="_{">
                                <i class="bi bi-plus-circle"></i>
                                Add
                            </button>
                        </form>
                        <p>or</p>
                        <form onsubmit="return addDefaultTimeSlot(event)">
                            <label>Use default</label>
                            <br />
                            <select id="DTimeSlot" required></select>
                            <span
                                id="DTSTimeError"
                                style="display: none"
                                class="form-error"
                            ></span>
                            <br />
                            <br />
                            <button type="submit" data-shortcut="[">
                                <i class="bi bi-plus-circle"></i>
                                Add
                            </button>
                        </form>
                    </div>
                </div>
                <div class="form">
                    <h1>Tasks</h1>
                    <div class="form-content">
                        <form onsubmit="addTask(event)">
                            <label>Time slot </label>
                            <select id="TTimeSlot" required></select>
                            <br />
                            <br />
                            <label>Length </label
                            ><input
                                required
                                type="number"
                                min="0"
                                max="4"
                                step="1"
                                id="TLength"
                                value="1"
                            /><span>:</span
                            ><input
                                required
                                type="number"
                                min="0"
                                max="59"
                                step="5"
                                id="TLengthMins"
                                value="00"
                            />
                            <br />
                            <label>Name</label>
                            <input required type="text" id="TName" />
                            <br /><br />
                            <button type="submit" data-shortcut="_}">
                                <i class="bi bi-plus-circle"></i>
                                Add
                            </button>
                        </form>
                        <p>or</p>
                        <form onsubmit="return addDefaultTask(event)">
                            <label>Use default</label>
                            <br />
                            <select id="DTask" required></select>
                            <br />
                            <br />
                            <button type="submit" data-shortcut="]">
                                <i class="bi bi-plus-circle"></i>
                                Add
                            </button>
                        </form>
                    </div>
                </div>
                <div class="form" id="managementPanel">
                    <button id="print-button" data-shortcut="1">Print</button>
                    <button id="save-button" data-shortcut="2">
                        Save timetable
                    </button>
                    <input type="file" id="load-button" style="display: none" />
                    <label
                        for="load-button"
                        data-shortcut="3"
                        id="load-button-text"
                        ><i class="bi bi-upload"></i>&nbsp;Load timetable</label
                    >
                    <button id="clear-button" data-shortcut="4">
                        Clear timetable
                    </button>
                </div>
            </div>
        </div>
        <script src="dist/index.js"></script>
    </body>
</html>
